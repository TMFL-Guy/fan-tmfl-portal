   const t=s[c], ranks=Object.fromEntries(t.map((name,i)=>[name,i]));
   const w=[add(c+'-WC-0','Wild Card',c,t[6],t[1]),add(c+'-WC-1','Wild Card',c,t[5],t[2]),add(c+'-WC-2','Wild Card',c,t[4],t[3])];
   let d1=null,d2=null;
   if(w.every(Boolean)){
     const low=[...w].sort((a,b)=>ranks[b]-ranks[a])[0];
     const other=w.filter(x=>x!==low).sort((a,b)=>ranks[a]-ranks[b]);
     d1=add(c+'-DIV-0','Divisional',c,low,t[0]);
     d2=add(c+'-DIV-1','Divisional',c,other[1],other[0]);
   }else{
     add(c+'-DIV-0','Divisional',c,'TBD',t[0]);
     add(c+'-DIV-1','Divisional',c,'TBD','TBD');
   }
   if(d1&&d2){const ordered=[d1,d2].sort((a,b)=>ranks[a]-ranks[b]);add(c+'-FINAL','Conference Championship',c,ordered[1],ordered[0]);}
   else add(c+'-FINAL','Conference Championship',c,'TBD','TBD');
 }
 const af=winners['AFC-FINAL'],nf=winners['NFC-FINAL'];
 add('CHAMP','TMFL Championship','TMFL',nf||'TBD',af||'TBD');
 return all;
}
function playoffResultsView(){
 const status=playoffFinalsStatus();
 if(!playoffAccess())return `<div class="panel"><h2>Playoff Schedule & Results</h2><p class="warning">Locked until all 18 weeks have official final results.</p><p class="muted">${status.finished} of ${status.total} regular-season games are official. Playoff matchups will appear after Week 18 is complete.</p></div>`;
 const games=playoffGames(),done=games.filter(g=>g.final).length;
 const rounds=['Wild Card','Divisional','Conference Championship','TMFL Championship'];
 let html=`<div class="panel"><h2>Playoff Schedule & Results</h2>${PROTOTYPE_PLAYOFF_ACCESS&&!status.ready?'<p class="warning">PROTOTYPE PREVIEW: Playoff schedule and results are available for testing before Week 18. These are provisional matchups based on current standings. Exported public versions restore the normal lock.</p>':''}<p class="muted">${done} of ${games.length} playoff games are final. Matchups advance automatically from official playoff winners. ${PUBLIC_PORTAL?'Official results are read-only on the published portal.':'Enter playoff scores here, then use Admin / Official Results → Download Updated index.html to publish.'}</p>${playoffStarted()?'<p class="warning">The first official playoff final has been entered. All fan playoff predictions are now locked.</p>':''}</div>`;
 for(const round of rounds){html+=`<h3>${round}</h3><div class="grid">`;
  for(const g of games.filter(x=>x.round===round)){
   const v=g.value;
   html+=`<div class="game"><div class="row space"><strong>${esc(g.away)} @ ${esc(g.home)}</strong><span class="pill">${esc(g.conference)}</span></div><p class="muted">${g.final?'OFFICIAL FINAL':g.ready?'Awaiting result':'Awaiting earlier playoff results'}</p>`;
   if(PUBLIC_PORTAL){html+=g.final?`<strong>${esc(g.away)} ${v.a} — ${v.h} ${esc(g.home)}${v.ot?' (OT)':''}</strong>`:'<p class="muted">Score pending</p>'}
   else{html+=`<div class="teamrow"><strong>${esc(g.away)}</strong><input type="number" min="0" max="999" id="${g.id}-a" value="${v?v.a:''}" ${g.ready?'':'disabled'}></div><div class="teamrow"><strong>${esc(g.home)}</strong><input type="number" min="0" max="999" id="${g.id}-h" value="${v?v.h:''}" ${g.ready?'':'disabled'}></div><label><input type="checkbox" id="${g.id}-ot" ${v?.ot?'checked':''} ${g.ready?'':'disabled'}> Overtime</label><div class="actions"><button ${g.ready?'':'disabled'} onclick="setPlayoffFinal('${g.id}')">Set Official Final</button><button ${g.final?'':'disabled'} onclick="clearPlayoffFinal('${g.id}')">Clear Final</button></div>`;}
   html+='</div>';
  }html+='</div>';
 }
 return html;
}
window.setPlayoffFinal=id=>{
 if(PUBLIC_PORTAL||!playoffAccess())return;
 const g=playoffGames().find(g=>g.id===id);
 if(!g||!g.ready)return alert('Finish the earlier playoff games first.');
 const a=document.getElementById(id+'-a').value,h=document.getElementById(id+'-h').value,ot=document.getElementById(id+'-ot').checked;
 if(!validScore(a)||!validScore(h))return alert('Enter valid whole-number scores for both teams.');
 if(Number(a)===Number(h))return alert('Playoff games must have a winner. Regular-season ties are still allowed.');
 if(ot&&(Number(a)===0||Number(h)===0))return alert('OT shutout scoring needs a TMFL ruling.');
 playoffOfficial[id]={a:Number(a),h:Number(h),ot,away:g.away,home:g.home};
 savePlayoffOfficial();render();
};
window.clearPlayoffFinal=id=>{
 if(PUBLIC_PORTAL||!playoffAccess())return;
 if(!confirm('Clear this official playoff final? Dependent later-round results may become invalid.'))return;

};
function matchup(id,a,b,p){let v=p[id],winner=[a,b].includes(v)?v:null;return `<div class="match"><span class="muted">${esc(id)}</span>${[a,b].map(t=>`<button ${t==='TBD'||!canPredictPlayoffs()?'disabled':''} class="${winner===t?'selected':''}" onclick="pickPlayoff('${esc(id)}','${esc(t)}')">${esc(t)} ${winner===t?'✓':''}</button>`).join('')}</div>`}
function playoffsView(){let r=records(),ss=seeds(r),p=bracket().playoffs,champions=[];let status=playoffFinalsStatus(),predictionsOpen=canPredictPlayoffs();let html=`<h2>TMFL Playoff Predictor</h2><p class="muted">Four division champions and three wild cards per conference. #1 gets a bye; divisional round reseeds. Choose winners to advance.</p><div class="panel"><div class="row space"><strong>${predictionsOpen?'Playoff predictions unlocked':playoffStarted()?'Playoff predictions closed — official playoffs have begun':'Playoff predictions locked'}</strong><button onclick="clearPlayoffPredictions()" ${playoffStarted()?'disabled':''}>Clear Playoff Predictions</button></div><p class="muted">${status.finished} of ${status.total} scheduled games have official final scores. ${predictionsOpen?'You can select playoff winners until the first official playoff final is recorded.':playoffStarted()?'The first official playoff final has been recorded; predictions cannot be changed or cleared.':'All scheduled games across Weeks 1–18 must have official final scores before playoff picks can be made. You can still clear test predictions now.'}</p></div><div class="bracket">`;for(let c of ['AFC','NFC']){let arr=ss[c],rank=Object.fromEntries(arr.map((t,i)=>[t,i+1])),wc=[[arr[1],arr[6]],[arr[2],arr[5]],[arr[3],arr[4]]],wcW=wc.map((m,i)=>m.includes(p[c+'-WC-'+i])?p[c+'-WC-'+i]:null),divs=[['TBD','TBD'],['TBD','TBD']];if(wcW.every(Boolean)){let lowest=[...wcW].sort((a,b)=>rank[b]-rank[a])[0],other=wcW.filter(t=>t!==lowest).sort((a,b)=>rank[a]-rank[b]);divs=[[arr[0],lowest],other]}let divW=divs.map((m,i)=>m.includes(p[c+'-DIV-'+i])?p[c+'-DIV-'+i]:null),cf=divW.every(Boolean)?divW:['TBD','TBD'],cw=cf.includes(p[c+'-FINAL'])?p[c+'-FINAL']:null;champions.push(cw||'TBD');html+=`<div class="panel"><h3>${c} Seeds</h3><ol>${arr.map((t,i)=>`<li>${esc(t)} ${i===0?'(bye)':i<4?'(division winner)':'(wild card)'}</li>`).join('')}</ol><h3>Wild Card</h3>${wc.map((m,i)=>matchup(c+'-WC-'+i,...m,p)).join('')}<h3>Divisional</h3>${divs.map((m,i)=>matchup(c+'-DIV-'+i,...m,p)).join('')}<h3>Conference Championship</h3>${matchup(c+'-FINAL',...cf,p)}</div>`}html+=`</div><div class="panel"><h2>TMFL Championship</h2>${matchup('CHAMP',...champions,p)}</div>`;return html}
function bracketsView(){return `<div class="panel"><h2>My Predictions</h2><p class="muted note"><strong>How to use:</strong> Create or select a prediction set to make different game, standings, and playoff picks; switch sets anytime, and use Export or Import to back up or transfer your predictions. Each set is saved separately in this browser.</p><div class="row"><label>Current prediction set <select onchange="state.current=this.value;persist();render()">${Object.keys(state.brackets).map(n=>`<option ${n===state.current?'selected':''} value="${esc(n)}">${esc(n)}</option>`).join('')}</select></label><button onclick="newBracket()">New Prediction Set</button><button onclick="deleteBracket()">Delete Prediction Set</button><button onclick="exportBrackets()">Export My Predictions</button></div><p><label>Import saved predictions <input type="file" accept=".json,application/json" onchange="importBrackets(event)"></label></p></div><div class="panel"><h3>How fan saving works</h3><p class="note">Your predictions stay in your browser's local storage. Official results are included in the published HTML file; an admin's local edits are not visible to fans until the owner publishes an updated HTML file.</p></div>`}
function scheduleView(){
 const gs=gamesByWeek(editorWeek), used=new Set(gs.flatMap(g=>[g.away,g.home]));
 const repeats=TEAMS.filter(t=>gs.filter(g=>g.away===t||g.home===t).length>1);
 const byes=TEAMS.filter(t=>!used.has(t));
 const teamOptions=(selected)=>TEAMS.map(t=>`<option value="${esc(t)}" ${t===selected?'selected':''}>${esc(t)}</option>`).join('');
 return `<div class="panel"><h2>Schedule Editor</h2><p class="note">Edit the games below, then click <strong>Save Schedule Changes</strong>. To share the updated schedule with fans, click <strong>Download Updated index.html</strong> and publish that file on your website. Changes saved here affect only this browser until published.</p><div class="row"><label>Week <select onchange="editorWeek=Number(this.value);render()">${Array.from({length:18},(_,i)=>`<option value="${i+1}" ${editorWeek===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></label><button onclick="addScheduledGame()">Add Game</button><button onclick="saveSchedule()">Save Schedule Changes</button><button onclick="exportSite()">Download Updated index.html</button></div><p class="muted">${gs.length} games • ${byes.length?`Not scheduled / bye: ${byes.map(esc).join(', ')}`:'All 32 teams scheduled'}</p>${repeats.length?`<p class="warning">Double-booked teams: ${repeats.map(esc).join(', ')}. Please correct these before publishing.</p>`:''}</div><div class="grid">${gs.map(g=>`<div class="game" data-schedule-id="${esc(g.id)}"><div class="row space"><strong>${esc(g.id)}</strong><button onclick="removeScheduledGame('${esc(g.id)}')">Remove Game</button></div><div class="teamrow"><label>Away</label><select data-field="away">${teamOptions(g.away)}</select></div><div class="teamrow"><label>Home</label><select data-field="home">${teamOptions(g.home)}</select></div><div class="teamrow"><label>TV slot</label><select data-field="slot">${['Not Aired','TNF','FNF','SAT','SNF','MNF','GOTW'].map(v=>`<option value="${v}" ${g.slot===v?'selected':''}>${v==='GOTW'?'Game of the Week':v||'Not Aired'}</option>`).join('')}</select></div></div>`).join('')}</div>`;
}
function captureSchedule(){
 for(const el of document.querySelectorAll('[data-schedule-id]')){
  const g=SCHEDULE.find(g=>g.id===el.dataset.scheduleId);if(!g)continue;
  const a=el.querySelector('[data-field="away"]').value,h=el.querySelector('[data-field="home"]').value,slot=el.querySelector('[data-field="slot"]').value;
  if(a!==g.away||h!==g.home){delete official[g.id];for(const b of Object.values(state.brackets))delete b.games[g.id]}
  g.away=a;g.home=h;g.slot=slot;
 }
}
window.saveSchedule=()=>{captureSchedule();for(const g of SCHEDULE){if(g.away===g.home)return alert('A team cannot play itself. Check Week '+g.week)}localStorage.setItem(SCHEDULE_STORE,JSON.stringify(SCHEDULE));saveOfficial();persist();render();alert('Schedule saved in this browser. Download Updated index.html to publish it for fans.')};
window.addScheduledGame=()=>{captureSchedule();let n=1,id;do{id='W'+String(editorWeek).padStart(2,'0')+'G'+String(n).padStart(2,'0');n++}while(SCHEDULE.some(g=>g.id===id));const g={id,week:editorWeek,away:'Bills',home:'Rams',slot:'Not Aired',official:null};SCHEDULE.push(g);SCHEDULE.sort((a,b)=>a.week-b.week||a.id.localeCompare(b.id));render()};
window.removeScheduledGame=id=>{captureSchedule();const g=SCHEDULE.find(g=>g.id===id);if(!g||!confirm('Remove '+g.away+' @ '+g.home+'?'))return;SCHEDULE=SCHEDULE.filter(g=>g.id!==id);delete official[id];for(const b of Object.values(state.brackets))delete b.games[id];render()};
function adminView(){let count=Object.keys(official).filter(id=>SCHEDULE.some(g=>g.id===id)).length;return `<div class="panel"><h2>Official Results • Site Owner</h2><p class="warning">This screen is a local editing utility, not a password-protected admin panel. Anyone viewing the site can edit official results <strong>on their own device only</strong>. These edits never change the published website or anyone else's predictions.</p><p>Local official results entered: ${count}. To publish them for all fans, export a new <code>index.html</code> and replace the file on your GitHub Pages site.</p><div class="row"><label>Week <select id="admin-week" onchange="window.adminWeek=Number(this.value);render()">${Array.from({length:18},(_,i)=>`<option value="${i+1}" ${(window.adminWeek||1)===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></label><button onclick="exportSite()">Download Updated index.html</button><button onclick="exportOfficial()">Backup Official Results</button><label>Restore official results <input type="file" accept=".json" onchange="importOfficial(event)"></label></div><p class="muted">Keep your official-results backup private until you're ready to publish. A newly published file will override fan predictions only for completed games.</p></div><div class="grid">${gamesByWeek(window.adminWeek||1).map(g=>gameCard(g,true)).join('')}</div>`}
window.setScore=(id,admin)=>{let g=SCHEDULE.find(x=>x.id===id),a=document.getElementById(id+'-a').value,h=document.getElementById(id+'-h').value,ot=document.getElementById(id+'-ot').checked;if(!g||!validScore(a)||!validScore(h))return alert('Enter a whole-number score from 0 to 999 for both teams.');a=Number(a);h=Number(h);if(ot&&a!==h&&(a===0||h===0))return alert('OT shutout scoring is unresolved. Leave this game pending until TMFL rules are confirmed.');let target=admin?official:bracket().games;target[id]={a,h,ot};if(admin)saveOfficial();else persist();render()};
window.clearScore=(id,admin)=>{delete (admin?official:bracket().games)[id];if(admin)saveOfficial();else persist();render()};
window.pickPlayoff=(id,t)=>{if(!canPredictPlayoffs())return alert('Playoff predictions are locked until Week 18 is complete, or once the first official playoff final is entered.');bracket().playoffs[id]=t;persist();render()};
window.clearWeekPredictions=()=>{const ids=new Set(gamesByWeek(state.week).map(g=>g.id));const count=Object.keys(bracket().games).filter(id=>ids.has(id)).length;if(!count)return alert('No predictions to clear for Week '+state.week+'.');if(!confirm('Clear '+count+' predicted game result(s) for Week '+state.week+' in '+state.current+'? Official finals will not be affected.'))return;for(const id of ids)delete bracket().games[id];persist();render()};
window.clearAllRegularPredictions=()=>{const count=Object.keys(bracket().games).length;if(!count)return alert('No regular-season predictions to clear.');if(!confirm('Clear all '+count+' regular-season predictions across all 18 weeks in '+state.current+'? Official finals and playoff picks will not be affected.'))return;bracket().games={};persist();render()};
window.clearPlayoffPredictions=()=>{if(playoffStarted())return alert('Playoff predictions cannot be cleared after the first official playoff final.');if(!confirm('Clear all playoff winner picks in '+state.current+'? Regular-season predictions and official results will not be changed.'))return;bracket().playoffs={};persist();render()};
window.newBracket=()=>{let n=prompt('New bracket name:');if(!n)return;n=n.trim().slice(0,55);if(!n||n==='__proto__'||n==='constructor'||Object.hasOwn(state.brackets,n))return alert('Choose a different bracket name.');state.brackets[n]={games:{},playoffs:{}};state.current=n;persist();render()};
window.deleteBracket=()=>{if(Object.keys(state.brackets).length<=1)return alert('Keep at least one bracket.');if(!confirm('Delete '+state.current+'?'))return;delete state.brackets[state.current];state.current=Object.keys(state.brackets)[0];persist();render()};
function download(name,data,mime='application/json'){let blob=new Blob([data],{type:mime}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
window.exportBrackets=()=>download('tmfl-my-brackets.json',JSON.stringify({version:3,brackets:state.brackets,current:state.current},null,2));

async function readJSON(e){let f=e.target.files[0];if(!f)return null;if(f.size>2e6)throw Error('File too large');return JSON.parse(await f.text())}
window.importBrackets=async e=>{try{let o=await readJSON(e);if(!o)return;if(!o.brackets||typeof o.brackets!=='object'||Array.isArray(o.brackets))throw Error('Invalid brackets file');let b=Object.create(null);for(let [n,v] of Object.entries(o.brackets)){if(n.length>55||!v||typeof v!=='object'||!v.games||!v.playoffs)continue;b[n]={games:{},playoffs:{}};if(Array.isArray(v.finalStandings)){let seen=new Set();b[n].finalStandings=[...v.finalStandings,...defaultPredictedOrder()].filter(t=>TEAMS.includes(t)&&!seen.has(t)&&seen.add(t))}for(let [id,x] of Object.entries(v.games)){let g=SCHEDULE.find(g=>g.id===id),y=g&&normalize(g,x);if(y)b[n].games[id]=y}for(let [id,t] of Object.entries(v.playoffs)){if(typeof t==='string'&&TEAMS.includes(t)&&id.length<40)b[n].playoffs[id]=t}}if(!Object.keys(b).length)throw Error('No valid brackets found');state.brackets=b;state.current=Object.hasOwn(b,o.current)?o.current:Object.keys(b)[0];persist();render()}catch(e){alert(e.message)}};
window.importOfficial=async e=>{try{let o=await readJSON(e);if(!o||typeof o!=='object'||Array.isArray(o))throw Error('Invalid official results');let clean={};for(let g of SCHEDULE){let v=normalize(g,o[g.id]);if(v)clean[g.id]=v}official=clean;saveOfficial();render()}catch(e){alert(e.message)}};
window.exportSite=()=>{if(PUBLIC_PORTAL)return;if(tab==='schedule')captureSchedule();for(const g of SCHEDULE){if(g.away===g.home)return alert('Fix the same-team matchup in Week '+g.week+' before exporting.')}localStorage.setItem(SCHEDULE_STORE,JSON.stringify(SCHEDULE));saveOfficial();savePlayoffOfficial();saveHistory();persist();let html='<!doctype html>'+document.documentElement.outerHTML;html=html.replace(/let SCHEDULE=\[[\s\S]*?\];\s*const DIVS=/,`let SCHEDULE=${JSON.stringify(SCHEDULE)};\nconst DIVS=`);html=html.replace(/const PUBLISHED_RESULTS=\{[^;]*\};/,`const PUBLISHED_RESULTS=${JSON.stringify(official)};`);html=html.replace(/const PUBLISHED_PLAYOFF_RESULTS=\{[^;]*\};/,`const PUBLISHED_PLAYOFF_RESULTS=${JSON.stringify(playoffOfficial)};`);html=html.replace(/const PUBLISHED_HISTORY=\[[^;]*\];/,`const PUBLISHED_HISTORY=${JSON.stringify(historyEntries)};`);html=html.replace('const PUBLIC_PORTAL=true;','const PUBLIC_PORTAL=true;');html=html.replace('const PROTOTYPE_PLAYOFF_ACCESS=false;','const PROTOTYPE_PLAYOFF_ACCESS=false;');html=html.replace('','');html=html.replace('brackets:bracketsView','brackets:bracketsView');html=html.replace('if(false&&localStorage.getItem(SCHEDULE_STORE)&&Array.isArray(savedSchedule)','if(false&&localStorage.getItem(SCHEDULE_STORE)&&Array.isArray(savedSchedule)');download('index.html',html,'text/html')};
