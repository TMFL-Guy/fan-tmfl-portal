name: TMFL Independent Prediction Leaderboards
on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:
  push:
    paths:
      - tmfl-in-season-cup.json
      - scripts/build_pool_leaderboards.py
permissions:
  contents: write
  issues: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public leaderboard feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_pool_leaderboards.py
      - name: Commit updated leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmfl-pool-leaderboards.json
          if ! git diff --cached --quiet; then
            git commit -m "Update independent prediction leaderboards"
            git push
          fi
