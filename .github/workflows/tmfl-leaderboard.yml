name: TMFL GitHub Prediction Leaderboard
on:
  issues:
    types: [opened, edited, reopened]
  push:
    paths:
      - tmfl-official-results.json
      - tmfl-schedule.json
      - scripts/tmfl_leaderboard.py
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: tmfl-leaderboard
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'TMFL Prediction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/tmfl_leaderboard.py
      - name: Publish leaderboard
        run: |
          if ! git diff --quiet -- tmfl-leaderboard.json || [ -n "$(git ls-files --others --exclude-standard tmfl-leaderboard.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tmfl-leaderboard.json
            git commit -m "Update TMFL fan prediction leaderboard"
            git pull --rebase
            git push
          fi
