name: Publish TMFL Fan Portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare minimal site artifact
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f ! -name 'README*' ! -name '.gitignore' -print0 | xargs -0 -r -I '{}' cp '{}' _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
